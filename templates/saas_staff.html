{% extends 'base.html' %}{% block content %}<link rel="stylesheet" href="{{ url_for('static',filename='platform.css') }}"><div class="pa"><div class="pa-hero"><h1>Staff management</h1><a href="{{ url_for('merchant.dashboard') }}">Back to dashboard</a></div><div class="pa-panel"><form method="post"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><label>Email<input type="email" name="email" required></label><label>Password<input type="password" name="password" minlength="12" required></label><label>Role<select name="role"><option>cashier</option><option>waiter</option><option>kitchen</option></select></label><button>Add staff</button></form></div>{% for st in staff %}<div class="pa-panel">{{ st.email }} · {{ st.role }} · {{ 'Active' if st.active else 'Disabled' }}<form method="post" action="{{ url_for('merchant.staff_toggle',sid=st.id) }}"><input type="hidden" name="_csrf" value="{{ csrf_token() }}"><button>{{ 'Deactivate' if st.active else 'Activate' }}</button></form></div>{% endfor %}</div>{% endblock %}
