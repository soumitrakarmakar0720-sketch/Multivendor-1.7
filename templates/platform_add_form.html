<form method="post" action="{{ url_for('merchant.add_merchant') }}">{{ csrf() }}{% for key,label in [('name','Business name'),('slug','Merchant handle (lowercase letters, numbers, hyphens)'),('email','Email'),('address','Business address'),('registration_ref','Registration reference')] %}<label>{{ label }}<input name="{{ key }}" {% if key == "slug" %}pattern="[a-zA-Z0-9][a-zA-Z0-9\-]{2,63}" minlength="3" maxlength="64" placeholder="royal-restaurant" title="3–64 letters, numbers or hyphens; no spaces"{% elif key == "email" %}type="email" maxlength="160"{% elif key == "name" %}maxlength="120"{% endif %} {% if key in ['name','slug','email'] %}required{% endif %}></label>{% endfor %}<label>Password<input type="password" name="password" minlength="12" maxlength="128" required></label><label>Billing type<select name="billing_type"><option value="retail">Retail</option><option value="restaurant">Restaurant</option></select></label><button>Create merchant</button></form>
