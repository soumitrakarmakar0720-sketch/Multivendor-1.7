<div class="menu-tile" data-name="{{ x.name|lower }}" data-price="{{ x.price }}"><strong>{{ x.name }}</strong><span>₹{{ x.price }}</span><input type="hidden" name="product_id" value="{{ x.id }}"><div class="qty-control"><button type="button" data-step="-1" aria-label="Decrease">−</button><input name="quantity" type="number" min="0" max="1000" value="0" aria-label="Quantity for {{ x.name }}"><button type="button" data-step="1" aria-label="Increase">+</button></div></div>
